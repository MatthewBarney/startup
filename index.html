<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>6D Chess</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <header class="d-flex flex-wrap justify-content-between align-items-center gap-3">
    <h1>6D Chess</h1>
    <a class="github-link btn" href="https://github.com/MatthewBarney/startup.git" target="_blank" rel="noopener noreferrer">View this project on GitHub</a>
  </header>
  <nav>
    <ul class="nav">
      <li class="nav-item"><a class="nav-link active" href="index.html">Home</a></li>
      <li class="nav-item"><a class="nav-link" href="play.html">Play</a></li>
      <li class="nav-item"><a class="nav-link" href="scoreboard.html">Scoreboard</a></li>
      <li class="nav-item"><a class="nav-link" href="rules.html">Rules</a></li>
      <li class="nav-item"><a class="nav-link" href="settings.html">Settings</a></li>
    </ul>
  </nav>
  <main>
    <p>Welcome to 6D Chess! Play a game, check the scoreboard or review the rules using the links above.</p>
    <form id="login" class="d-flex flex-wrap align-items-end gap-3">
      <div>
        <label for="username" class="form-label">Username</label>
        <input type="text" id="username" name="username" class="form-control" placeholder="Your name">
      </div>
      <div>
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="Password">
      </div>
      <button type="submit" class="btn">Login</button>
    </form>
    <div class="pieces">
      <img src="queen.png" alt="White queen chess piece">
      <img src="pawn.png" alt="Black pawn chess piece">
      <img src="knight.png" alt="White knight chess piece">
      <img src="king.png" alt="Black king chess piece">
      <img src="rook.png" alt="White rook chess piece">
      <img src="queen.png" alt="White queen chess piece">
      <img src="pawn.png" alt="Black pawn chess piece">
      <img src="knight.png" alt="White knight chess piece">
      <img src="bishop.png" alt="Black bishop chess piece">
    </div>
  </main>
</body>
</html>
