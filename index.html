<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>6D Chess</title>
  <style>
    .pieces {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-evenly;
      align-items: center;
      gap: 1rem;
    }
    .pieces img {
      width: 150px;
      max-width: 18%;
      height: auto;
    }
  </style>
</head>
<body>
  <h1>6D Chess</h1>
  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="play.html">Play</a></li>
      <li><a href="scoreboard.html">Scoreboard</a></li>
      <li><a href="rules.html">Rules</a></li>
      <li><a href="settings.html">Settings</a></li>
    </ul>
  </nav>
  <p>Welcome to 6D Chess! Play a game, check the scoreboard or review the rules using the links above.</p>
  <form>
    <label for="username">Username:</label>
    <input type="text" id="username" name="username">
    <br>
    <label for="password">Password:</label>
    <input type="password" id="password" name="password">
    <br>
    <button type="submit">Login</button>
  </form>
  <br><br><br><br>
  <div class="pieces">
    <img src="queen.png" alt="White queen chess piece">
    <img src="pawn.png" alt="Black pawn chess piece">
    <img src="knight.png" alt="White knight chess piece">
    <img src="king.png" alt="Black king chess piece">
    <img src="rook.png" alt="White rook chess piece">
    <img src="queen.png" alt="White queen chess piece">
    <img src="pawn.png" alt="Black pawn chess piece">
    <img src="knight.png" alt="White knight chess piece">
    <img src="bishop.png" alt="Black bishop chess piece">
  </div>
</body>
</html>
